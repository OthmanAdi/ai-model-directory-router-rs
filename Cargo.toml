[package]
name = "ai-model-directory-router"
version = "0.1.0"
edition = "2021"
description = "Model routing, cost calculation, fallback chains, and context management for the AI Model Directory"
license = "Apache-2.0"
repository = "https://github.com/The-Best-Codes/ai-model-directory"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
thiserror = "2"
