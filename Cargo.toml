[package]
name = "ai-model-directory-router"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Provider-aware AI model routing with exact costs and a current, refreshable models.dev catalog"
license = "Apache-2.0"
repository = "https://github.com/OthmanAdi/ai-model-directory-router-rs"
homepage = "https://github.com/OthmanAdi/ai-model-directory-router-rs"
readme = "README.md"
keywords = ["ai", "llm", "model-routing", "cost-calculation", "model-directory"]
categories = ["algorithms", "data-structures", "science"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "data/models-dev-api.json",
    "THIRD_PARTY_LICENSES/*.txt",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "LICENSE",
    "THANKS.md",
]

[features]
default = ["bundled"]
bundled = []
online = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde-with-arbitrary-precision"] }
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls"] }

[package.metadata.docs.rs]
all-features = true
